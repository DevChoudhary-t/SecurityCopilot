                      type: string
                      format: uri
                      pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/sslkeys$
                  required:
