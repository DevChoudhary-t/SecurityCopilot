openapi: 3.0.0
info:
  title: ANY.RUN Sandbox
  description: >
    [ANY.RUN](https://any.run) is a provider of malware analysis and threat
    intelligence services used by 15,000+ SOC teams worldwide.


    This documentation is designed to guide you through seamless integration of
    [ANY.RUN's](https://any.run) Interactive Sandbox into your security
    infrastructure for faster threat analysis, alert resolution, and incident
    response.


    With the Sandbox API, you can:

    - Submit files and URLs for analysis

    - Monitor analysis progress in real time

    - Get detailed reports

    - Manage analysis sessions


    You can also explore our **Threat Intelligence API**
    [here](https://any.run/api-documentation/#ti-lookup).


    For easier integration, use our SDK, available on
    [GitHub](https://github.com/anyrun/anyrun-sdk) and
    [PyPI](https://pypi.org/project/anyrun-sdk/).
  termsOfService: https://any.run/terms.pdf
  contact:
    name: ANY.RUN
    url: https://app.any.run/contact-us
    email: support@any.run
  version: 1.0.0
servers:
  - url: https://api.any.run
security:
  - API-Key: []
  - Basic: []
tags:
  - name: Analysis
    description: Operations on ANY.RUN Sandbox analysis tasks.
  - name: User
    description: Operations on ANY.RUN services users.
  - name: Environment
    description: Operations on ANY.RUN Sandbox environments.
externalDocs:
  description: ANY.RUN API documentation
  url: https://any.run/api-documentation/
paths:
  /v1/analysis/:
    get:
      tags:
        - Analysis
      summary: Get user tasks history
      description: Returns max of 100 last tasks from the user's history and their
        basic information.
      operationId: GetAnalysesHistory
      parameters:
        - $ref: "#/components/parameters/TeamHistoryParam"
        - $ref: "#/components/parameters/SkipHistoryParam"
        - $ref: "#/components/parameters/LimitHistoryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksHistoryDto"
              examples:
                Success:
                  $ref: "#/components/examples/GetAnalysisExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
    post:
      tags:
        - Analysis
      summary: Submit a file or a URL for malware analysis
      description: Creates a new analysis task and returns an identifier. If the task
        starts immediately, it returns taskUuid. If the task is queued, it
        returns queueTaskId (temporary). Once a queued task starts, use the
        taskUuid (via GET /v1/analysis/monitor/{taskUuid}) to track it.
      operationId: RunNewAnalysis
      requestBody:
        $ref: "#/components/requestBodies/CreateTaskBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmitDto"
              examples:
                Success:
                  $ref: "#/components/examples/RunNewAnalysisExample"
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSubmitQueuedDto"
              examples:
                Success:
                  $ref: "#/components/examples/RunNewAnalysisQueuedExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_PlanRequirementsNotMetError:
                  $ref: "#/components/examples/ErrorExample_403_PlanRequirementsNotMetError"
                400_PlanRequirementsNotMetError:
                  $ref: "#/components/examples/ErrorExample_400_PlanRequirementsNotMetError"
                400_PublicTasksWithBrandedReportsError:
                  $ref: "#/components/examples/ErrorExample_400_PublicTasksWithBrandedReportsErro\
                    r"
  /v1/analysis/{taskUuid}:
    get:
      tags:
        - Analysis
      summary: Get analysis report
      description: Returns analysis report on a submission by its task ID.
      operationId: GetAnalysisReport
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDocumentDto"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_TaskAccessForbiddenError:
                  $ref: "#/components/examples/ErrorExample_403_TaskAccessForbiddenError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
  /v1/analysis/addtime/{taskUuid}:
    patch:
      tags:
        - Analysis
      summary: Add analysis time to a task
      description: Adds 60 seconds to the task runtime by the task ID if the task has
        not been completed yet.
      operationId: ProlongAnalysis
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAddTimeDto"
              examples:
                Success:
                  $ref: "#/components/examples/ProlongAnalysisExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_TaskAccessForbiddenError:
                  $ref: "#/components/examples/ErrorExample_403_TaskAccessForbiddenError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
                400_TaskAlreadyCompletedError:
                  $ref: "#/components/examples/ErrorExample_400_TaskAlreadyCompletedError"
  /v1/analysis/stop/{taskUuid}:
    patch:
      tags:
        - Analysis
      summary: Stop task
      description: Stops task by the task ID if the task has not been completed yet.
      operationId: StopAnalysis
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStopDto"
              examples:
                Success:
                  $ref: "#/components/examples/StopAnalysisExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_TaskAccessForbiddenError:
                  $ref: "#/components/examples/ErrorExample_403_TaskAccessForbiddenError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
                400_TaskAlreadyCompletedError:
                  $ref: "#/components/examples/ErrorExample_400_TaskAlreadyCompletedError"
  /v1/analysis/delete/{taskUuid}:
    delete:
      tags:
        - Analysis
      summary: Delete task
      description: Deletes a task in ANY.RUN if the user making the request has the
        rights to do so.
      operationId: DeleteAnalysis
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDeleteDto"
              examples:
                Success:
                  $ref: "#/components/examples/DeleteAnalysisExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_TaskAccessForbiddenError:
                  $ref: "#/components/examples/ErrorExample_403_TaskAccessForbiddenError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
                400_TaskIsRunningError:
                  $ref: "#/components/examples/ErrorExample_400_TaskIsRunningError"
  /v1/analysis/monitor/{taskUuid}:
    get:
      tags:
        - Analysis
      summary: Get task status stream
      description: Returns task status by identifier. The {taskUuid} parameter can be
        taskUuid for active or completed tasks or queueTaskId for queued tasks.
        If a queued task has started, the response will include its taskUuid.
      operationId: GetAnalysisStatusStream
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                Task_running:
                  $ref: "#/components/examples/TaskRunningExample"
                Task_soon:
                  $ref: "#/components/examples/TaskRunningExample"
                Task_error:
                  $ref: "#/components/examples/TaskPreLauncErrorExample"
                Task_queued:
                  $ref: "#/components/examples/TaskQueuedExample"
                Task_canceled_or_unknown:
                  $ref: "#/components/examples/TaskCanceledOrUnknownExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_TaskAccessForbiddenError:
                  $ref: "#/components/examples/ErrorExample_403_TaskAccessForbiddenError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
  /v1/environment/:
    get:
      tags:
        - Environment
      summary: Get available environments
      description: Returns information about available environment configurations in
        the sandbox.
      operationId: GetEnvironment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvironmentsDto"
              examples:
                Success:
                  $ref: "#/components/examples/GetEnvironmentsExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
  /v1/user/:
    get:
      tags:
        - User
      summary: Get user's limits
      description: Returns user's API limits.
      operationId: GetUserLimits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLimitsDto"
              examples:
                Success:
                  $ref: "#/components/examples/GetUserLimitsExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
  /v1/user/presets:
    get:
      tags:
        - User
      summary: Get user's sandbox presets
      description: Returns user's sandbox presets information.
      operationId: GetUserPresets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPresetDto"
              examples:
                Success:
                  $ref: "#/components/examples/GetUserPresetsExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
  /report/{taskUuid}/ioc/json:
    get:
      tags:
        - Analysis
      summary: Get IOCs extracted from submission analysis
      description: Returns IOCs extracted from analysis, conducted on a submission, by
        its task ID.
      operationId: GetIOCJson
      parameters:
        - $ref: "#/components/parameters/TaskUuidParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IocDto"
              examples:
                Success:
                  $ref: "#/components/examples/GetIOCJsonExample"
        4XX:
          description: Not OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocumentDto"
              examples:
                403_UnauthorizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnauthorizedError"
                403_WrongCredentialsError:
                  $ref: "#/components/examples/ErrorExample_403_WrongCredentialsError"
                403_UnrecognizedError:
                  $ref: "#/components/examples/ErrorExample_403_UnrecognizedError"
                403_ApiUnavailableError:
                  $ref: "#/components/examples/ErrorExample_403_ApiUnavailableError"
                403_ApiDisabledError:
                  $ref: "#/components/examples/ErrorExample_403_ApiDisabledError"
                403_PlanRequirementsNotMetError:
                  $ref: "#/components/examples/ErrorExample_403_PlanRequirementsNotMetError"
                400_PlanRequirementsNotMetError:
                  $ref: "#/components/examples/ErrorExample_400_PlanRequirementsNotMetError"
                403_PrivateContentError:
                  $ref: "#/components/examples/ErrorExample_403_PrivateContentError"
                404_TaskNotFoundError:
                  $ref: "#/components/examples/ErrorExample_404_TaskNotFoundError"
                400_TaskInvalidUuidError:
                  $ref: "#/components/examples/ErrorExample_400_TaskInvalidUuidError"
components:
  parameters:
    TeamHistoryParam:
      name: team
      description: Set to true to receive team history.
      in: query
      required: false
      schema:
        type: boolean
        default: false
    SkipHistoryParam:
      name: skip
      description: Set the number of elements to bypass before starting data retrieval.
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        default: 0
    LimitHistoryParam:
      name: limit
      description: Set the number of elements returned in one request.
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 100
        default: 25
    TaskUuidParam:
      name: taskUuid
      description: Specify the unique identifier (UUID) of the task.
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidDto"
  requestBodies:
    CreateTaskBody:
      description: Multipart form-data with parameters of a task to be created.
      required: true
      content:
        multipart/form-data:
          examples:
            CreateUrlAnalysis:
              $ref: "#/components/examples/CreateUrlAnalysisExample"
          schema:
            type: object
            additionalProperties: false
            properties:
              obj_type:
                description: Specify the type of task you want to launch. Note that option
                  `rerun` **MUST** only be used with the parameter
                  `task_rerun_uuid`.
                type: string
                enum:
                  - file
                  - url
                  - download
                  - rerun
                default: file
              file:
                type: string
                format: binary
                description: Provide the file to be analyzed.
              obj_url:
                description: "Specify the URL you want to analyze. This parameter **MUST** only
                  be used with `obj_type`: `url` or `obj_type`: `download`."
                type: string
              task_rerun_uuid:
                description: "Provide the UUID of the task you want to restart. This parameter
                  **MUST** only be used with `obj_type`: `rerun`."
                type: string
              env_os:
                description: Specify the operating system for your analysis.
                type: string
                enum:
                  - windows
                  - linux
                  - android
                  - macos
                default: windows
              env_bitness:
                description: >
                  Specify the bitness of the operating system. This parameter
                  has the following restrictions:
                    - allowed values for *windows*: `32`, `64` (default);
                    - allowed values for *linux*: `64` (default);
                    - allowed values for *android*: `64` (default);
                    - allowed values for *macos*: `64` (default);
                type: number
                enum:
                  - 32
                  - 64
                default: 64
              env_version:
                description: >
                  Specify the version of the OS. This parameter has the
                  following restrictions:
                    - allowed values for *windows*: `7`, `10` (default), `11`, `server 2025`;
                    - allowed values for *linux*: `12.2` (debian), `22.04.2` (ubuntu / default);
                    - allowed values for *android*: `14` (default);
                    - allowed values for *macos*: `15` (default);
                type: string
                enum:
                  - "7"
                  - "10"
                  - "11"
                  - "12.2"
                  - 22.04.2
                  - "14"
                  - "15"
                  - server 2025
              env_type:
                description: >
                  Specify the environment preset type. This parameter has the
                  following restrictions:
                    - allowed values for *windows*: `complete` (default), `development` (only windows 10 64bit);
                    - allowed values for *linux*: `complete` (default);
                    - allowed values for *android*: `complete` (default);
                    - allowed values for *macos*: `complete` (default);

                  Values `clean` and `office` are **deprecated** starting **June
                  2, 2025**.
                type: string
                enum:
                  - complete
                  - development
              env_locale:
                description: Specify the operating system's language.
                type: string
                enum:
                  - ar-EG
                  - ar-IQ
                  - ar-KW
                  - ar-QA
                  - ar-SA
                  - ar-SY
                  - ar-YE
                  - be-BY
                  - bg-BG
                  - cs-CZ
                  - da-DK
                  - de-AT
                  - de-CH
                  - de-DE
                  - el-GR
                  - en-AU
                  - en-CA
                  - en-GB
                  - en-IE
                  - en-NZ
                  - en-SG
                  - en-US
                  - en-ZA
                  - es-AR
                  - es-CL
                  - es-CO
                  - es-ES
                  - es-MX
                  - es-PE
                  - es-UY
                  - es-VE
                  - et-EE
                  - fa-IR
                  - fi-FI
                  - fr-CH
                  - fr-FR
                  - he-IL
                  - hi-IN
                  - hr-HR
                  - id-ID
                  - it-IT
                  - ja-JP
                  - ko-KR
                  - lt-LT
                  - lv-LV
                  - ms-MY
                  - nl-BE
                  - nl-NL
                  - nn-NO
                  - pl-PL
                  - pt-BR
                  - pt-PT
                  - ro-RO
                  - ru-RU
                  - sv-SE
                  - th-TH
                  - tr-TR
                  - uk-UA
                  - vi-VN
                  - zh-CN
                  - zh-HK
                  - zh-TW
                default: en-US
              opt_network_connect:
                description: Enable or disable network connectivity for the virtual machine.
                type: boolean
                default: true
              opt_network_fakenet:
                description: Enable or disable FakeNet, which simulates network behavior without
                  actual internet access.
                type: boolean
                default: false
              opt_network_tor:
                description: Enable or disable TOR browsing.
                type: boolean
                default: false
              opt_network_geo:
                description: Specify the geographic location for TOR traffic (if TOR is
                  enabled).
                type: string
                enum:
                  - fastest
                  - AU
                  - BR
                  - CH
                  - DE
                  - FR
                  - GB
