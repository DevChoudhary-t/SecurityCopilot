                  pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/report/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/ioc/json$
                STIX:
                  description: URL of the STIX report.
                  type: string
                  format: uri
                  pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/report/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/summary/stix$
                MISP:
                  description: URL of the MISP report.
                  type: string
                  format: uri
                  pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/report/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/summary/misp$
                graph:
                  description: URL of the Graph report.
                  type: string
                  format: uri
                  pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/graph$
