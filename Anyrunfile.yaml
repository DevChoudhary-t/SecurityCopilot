            - type
            - full
            - build
      required:
        - OS
    TaskStatusVerdictDto:
      type: object
      additionalProperties: false
      properties:
        threat_level:
          description: Threat level of the analysis.
          type: number
        text:
          $ref: "#/components/schemas/ThreatLevelTextDto"
      required:
        - threat_level
        - text
    TaskStatusSpecsDto:
      type: object
      additionalProperties: false
      properties:
        autostart:
          description: Indicates if threat uses autostart feature.
          type: boolean
        bad_module_certificate:
          type: boolean
        bad_process_certificate:
          type: boolean
        cpu_overrun:
          description: Indicates if overly high CPU usage was detected.
          type: boolean
        crashed_apps:
          description: Indicates if any application crash was detected.
          type: boolean
        crashed_task:
          description: Indicates if analysis task crash was detected.
          type: boolean
        debug_output:
          description: Indicates if any debug data was extracted.
          type: boolean
        executable_dropped:
          description: Indicates if threat uses dropped executables.
          type: boolean
        exploitable:
          description: Indicates if any known exploit was detected.
          type: boolean
        has_trace:
          type: boolean
        injects:
          description: Indicates if threat uses injections.
          type: boolean
        known_threat:
          description: Indicates if known malware was detected.
          type: boolean
        low_access:
          description: Indicates if threat uses low level access.
          type: boolean
        malware_config:
          description: Indicates if malware config was extracted from submitted file.
          type: boolean
        mem_overrun:
          description: Indicates if overly high RAM usage was detected.
          type: boolean
        multiprocessing:
          description: Indicates if threat uses multiprocessing.
          type: boolean
        network_loader:
          description: Indicates if network download was detected.
          type: boolean
        network_threats:
          description: Indicates if any network related threat was detected by Suricata
            engine.
          type: boolean
        not_started:
          description: Indicates if submitted file execution failed.
          type: boolean
        process_dump:
          description: Indicates if the process memory dump can be extracted.
          type: boolean
        reboot:
          description: Indicates if system reboot was detected.
          type: boolean
        service_luncher:
          description: Indicates if new service registration was detected.
          type: boolean
        spam:
          description: Indicates if spam was detected.
          type: boolean
        static_detections:
          description: Indicates if any malicious pattern was detected by static analysis
            engine.
          type: boolean
        stealing:
          description: Indicates if malware 'stealer' capability was detected.
          type: boolean
        susp_struct:
          type: boolean
        tor:
          description: Indicates if TOR traffic routing was enabled during task creation.
          type: boolean
        uac_request:
          description: Indicates if User Access Control (UAC) request was detected.
          type: boolean
    TaskStatusDto:
      title: Task status
      description: Task completion status.
      type: object
      additionalProperties: false
      properties:
        _id:
          type: string
          pattern: ^[0-9a-f]+$
        uuid:
          $ref: "#/components/schemas/UuidDto"
        status:
          description: >
            Task completion rate (%). This value can indicate the following task
            states:
              - -1 - the task is in the `FAILED` state;
              - 0-20 - the task is in the `PREPARING` state;
              - 21-99 - the task is in the `RUNNING` state;
              - 100 - the task is in the `COMPLETED` state;
          type: integer
          format: int32
          minimum: -1
          maximum: 100
        remaining:
          description: Number of seconds until task completion.
          type: integer
          format: int32
          minimum: 0
        times:
          type: object
          additionalProperties: false
          properties:
            timeout:
              description: Timeout for analysis in seconds.
              type: integer
              format: int32
              minimum: 0
            startExec:
              description: Human-readable timestamp of the analysis creation.
              type: string
              format: date-time
          required:
            - timeout
            - startExec
        public:
          type: object
          additionalProperties: false
          properties:
            maxAddedTimeReached:
              description: Indicates if maximum allowed task runtime was reached.
              type: boolean
            objects:
              type: object
              additionalProperties: false
              properties:
                runType:
                  $ref: "#/components/schemas/TaskTypeDto"
                mainObject:
                  $ref: "#/components/schemas/TaskStatusMainObjectDto"
              required:
                - runType
                - mainObject
            options:
              $ref: "#/components/schemas/TaskStatusOptionsDto"
            environment:
              $ref: "#/components/schemas/TaskStatusEnvironmentDto"
          required:
            - maxAddedTimeReached
            - objects
            - options
            - environment
        tags:
          $ref: "#/components/schemas/TagsDto"
        usersTags:
          $ref: "#/components/schemas/TagsDto"
        scores:
          type: object
          additionalProperties: false
          properties:
            verdict:
              $ref: "#/components/schemas/TaskStatusVerdictDto"
            specs:
              $ref: "#/components/schemas/TaskStatusSpecsDto"
          required:
            - verdict
            - specs
        actions:
          type: object
          additionalProperties: false
          properties:
            manualclosed:
              description: Indicates if the task was stopped manually by the user.
              type: boolean
          required:
            - manualclosed
        threats:
          description: Known threats discovered during analysis.
          type: array
          uniqueItems: true
          minItems: 0
          items:
            type: string
      required:
        - uuid
        - status
        - remaining
        - times
        - public
        - tags
        - usersTags
        - scores
