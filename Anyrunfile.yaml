                  - ZW
                default: fastest
              opt_privacy_type:
                description: Specify the visibility of analysis results.
                type: string
                enum:
                  - public
                  - bylink
                  - owner
                  - byteam
                default: bylink
              opt_timeout:
                description: Set the execution time for the analysis in seconds. Maximum allowed
                  value depends on the subscription plan.
                type: number
                minimum: 10
                maximum: 1200
                default: 60
              opt_automated_interactivity:
                description: Enable or disable Automated Interactivity (ML) feature, which
                  simulates user interactions.
                type: boolean
                default: true
              opt_auto_delete_after:
                description: Specify after what period of time this report should be deleted.
                type: string
                enum:
                  - day
                  - week
                  - 2 weeks
                  - month
              obj_ext_startfolder:
                description: >
                  Specify the starting location for the file. This parameter
                  also has the following restrictions:
                    - allowed values for *windows*: `desktop`, `home`, `downloads`, `appdata`, `temp` (default), `windows`, `root`;
                    - allowed values for *linux*: `desktop`, `home`, `downloads`, `temp` (default);
                    - allowed values for *android*: `downloads` (default);
                    - allowed values for *macos*: `desktop`, `home`, `downloads`, `temp` (default);
                type: string
                enum:
                  - desktop
                  - home
                  - downloads
                  - appdata
                  - temp
                  - windows
                  - root
              obj_ext_cmd:
                description: "Provide optional commands via cmd. This parameter **MUST** only be
                  used with `obj_type`: `file` or `obj_type`: `download`."
                type: string
              obj_ext_browser:
                description: >
                  Specify the browser to use for URL-based analysis. This
                  parameter **MUST** only be used with `obj_type`: `url`. This
                  parameter also has the following restrictions:
                    - allowed values for *windows*: `Internet Explorer`, `Microsoft Edge` (default), `Google Chrome`, `Mozilla Firefox`;
                    - allowed values for *linux*: `Google Chrome` (default), `Mozilla Firefox`;
                    - allowed values for *android*: -;
                    - allowed values for *macos*: `Safari` (default), `Google Chrome`, `Mozilla Firefox`;
                type: string
                enum:
                  - Internet Explorer
                  - Microsoft Edge
                  - Google Chrome
                  - Mozilla Firefox
                  - Safari
              obj_ext_useragent:
                description: "Specify the user agent. This parameter **MUST** only be used with
                  `obj_type`: `download`."
                type: string
              obj_ext_elevateprompt:
                deprecated: true
                description: Specify whether to prompt for elevation to administrator privileges
                  before running the file on Windows. Not applicable to Linux.
                  (Deprecated. Please use `obj_force_elevation` instead.)
                type: boolean
                default: false
              obj_force_elevation:
                description: Specify whether to force the file to execute with elevated
                  privileges and an elevated token (for PE32, PE32+, PE64 files
                  only). Not applicable for Linux.
                type: boolean
                default: false
              auto_confirm_uac:
                description: Enable or disable automatic confirmation of User Account Control
                  (UAC) prompts on Windows. Not applicable to Linux, use
                  run_as_root instead.
                type: boolean
                default: true
              run_as_root:
                description: Allow the file to run with superuser privileges on Linux. Not
                  applicable to Windows, use auto_confirm_uac instead.
                type: boolean
                default: false
              obj_ext_extension:
                description: Specify whether to change the file extension to a valid one.
                type: boolean
              opt_privacy_hidesource:
                description: "Specify whether to hide the source URL. This parameter **MUST**
                  only be used with `obj_type`: `download`."
                type: boolean
                default: false
              user_tags:
                description: "Append user tags to new analysis. Only characters a-z, A-Z, 0-9,
                  hyphen (-), and comma (,) are allowed. Max tag length: 16
                  characters. Max unique tags per task: 8."
                type: string
            required:
              - obj_type
  schemas:
    UuidDto:
      title: UUID
      description: Unique identifier (UUID) of the object.
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ThreatLevelTextDto:
      title: Threat level (text)
      description: Textual description of the overall threat level.
      type: string
      oneOf:
        - description: Indicates that detected threat level is `undetected`.
          const: No threats detected
        - description: Indicates that detected threat level is `suspicious`.
          const: Suspicious activity
        - description: Indicates that detected threat level is `malicious`.
          const: Malicious activity
    TagsDto:
      title: Tags
      description: Tags.
      type: array
      uniqueItems: true
      minItems: 0
      items:
        oneOf:
          - type: string
          - type: object
            additionalProperties: false
            properties:
              users:
                description: Indicates if the tag is set by users.
                type: boolean
              tag:
                description: The tag text.
                type: string
            required:
              - users
              - tag
    HashesApiDto:
      title: Hashes
      description: Object's hashes
      type: object
      additionalProperties: false
      properties:
        md5:
          description: MD5 hash string.
          type: string
          pattern: ^[0-9a-f]{32}$
        sha1:
          description: SHA1 hash string.
          type: string
          pattern: ^[0-9a-f]{40}$
        sha256:
          description: SHA256 hash string.
          type: string
          pattern: ^[0-9a-f]{64}$
        ssdeep:
          description: SSDEEP hash string.
          type: string
      required:
        - md5
    TaskHistoryDto:
      title: Task history
      description: Previously ran task.
      type: object
      additionalProperties: false
      properties:
        uuid:
          $ref: "#/components/schemas/UuidDto"
        verdict:
          $ref: "#/components/schemas/ThreatLevelTextDto"
        name:
          description: Name of the main object.
          type: string
        related:
          description: URL of the main analysis report.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        pcap:
          description: URL for downloading PCAP file from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/pcap$
        file:
          description: URL for downloading the main object from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/files/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        json:
          description: URL of the JSON report.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/report/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/summary/json$
        misp:
          description: URL of the MISP report.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/report/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/summary/misp$
        date:
          description: Human-readable timestamp of the analysis creation.
          type: string
          format: date-time
        tags:
          $ref: "#/components/schemas/TagsDto"
        hashes:
          $ref: "#/components/schemas/HashesApiDto"
      required:
        - uuid
        - verdict
        - related
        - json
        - misp
        - date
        - tags
        - hashes
    TasksHistoryDto:
      title: Tasks history
      description: List of previously ran tasks.
      type: array
      uniqueItems: true
      minItems: 0
      items:
        $ref: "#/components/schemas/TaskHistoryDto"
    ErrorDocumentDto:
      title: Error response document
      description: Top level error response document.
      type: object
      additionalProperties: false
      properties:
        error:
          description: True indicates a failed request.
          type: boolean
          const: true
        message:
          description: Provides information about the error.
          type: string
      required:
        - error
        - message
    TaskSubmitDto:
      title: Task submit
      description: Submit a file or a URL for malware analysis
      type: object
      additionalProperties: false
      properties:
        error:
          description: False indicates a successful request.
          type: boolean
          const: false
        data:
          description: Submitted task data
          type: object
          additionalProperties: false
          properties:
            taskid:
              description: Unique identifier (UUID) of the task.
              $ref: "#/components/schemas/UuidDto"
          required:
            - taskid
      required:
        - error
        - data
    TaskSubmitQueuedDto:
      title: Task submit queued
      description: File or URL submitted for malware analysis and queued for processing
      type: object
      additionalProperties: false
      properties:
        error:
          description: False indicates a successful request.
          type: boolean
          const: false
        message:
          description: Contains a response message about the task status.
          type: string
          const: false
        data:
          description: Submitted task data
          type: object
          additionalProperties: false
          properties:
            queueTaskId:
              description: Unique identifier (UUID) of the task in queue.
              $ref: "#/components/schemas/UuidDto"
          required:
            - queueTaskId
      required:
        - error
        - data
    UserPlanNameDto:
      title: Subscription plan
      description: Name of the user's sandbox plan.
      type: string
      oneOf:
        - title: Free
          const: Free
        - title: Tester
          const: Tester
        - title: Searcher
          const: Searcher
        - title: Trial Hunter
          const: Trial Hunter
        - title: Hunter
          const: Hunter
        - title: Ally
          const: Ally
        - title: Trial Enterprise
          const: Trial Enterprise
        - title: Enterprise
          const: Enterprise
        - title: Enterprise Suite
          const: Enterprise Suite
    PrivacyDto:
      title: Privacy setting
      description: Privacy level.
      type: string
      oneOf:
        - description: Indicates that chosen privacy level is `public`.
          const: public
        - description: Indicates that chosen privacy level is `bylink`.
          const: bylink
        - description: Indicates that chosen privacy level is `owner`.
          const: owner
        - description: Indicates that chosen privacy level is `byteam`.
          const: byteam
    ReportOptionsDto:
      type: object
      additionalProperties: false
      properties:
        timeout:
          description: Timeout for analysis in seconds.
          type: integer
          format: int32
          minimum: 0
        additionalTime:
          description: Additional time in seconds.
          type: integer
          format: int32
          minimum: 0
        fakeNet:
          description: Indicates if fake networking was used.
          type: boolean
        heavyEvasion:
          description: Indicates if heavy evasion techniques were used.
          type: boolean
        mitm:
          description: Indicates if man-in-the-middle was used.
          type: boolean
        presentation:
          description: Indicates if presentation mode was on.
          type: boolean
        video:
          description: Indicates if video recording was on.
          type: boolean
        hideSource:
          description: Indicates if source hiding was enabled.
          type: boolean
        network:
          description: Indicates if network activity was enabled.
          type: boolean
        privacy:
          $ref: "#/components/schemas/PrivacyDto"
        privateSample:
          description: Indicates if the task is private.
          type: boolean
        tor:
          type: object
          additionalProperties: false
          properties:
            used:
              description: Indicates if TOR was used.
              type: boolean
            geo:
              description: Indicates chosen TOR geolocation option.
              type: string
          required:
            - used
        automatization:
          type: object
          additionalProperties: false
          properties:
            interactivity:
              description: Indicates if interactivity automation was enabled.
              type: boolean
            uac:
              description: Indicates if UAC was enabled.
              type: boolean
          required:
            - uac
    ReportVerdictDto:
      type: object
      additionalProperties: false
      properties:
        score:
          description: Numeric score of the analysis.
          type: number
        threatLevel:
          description: Threat level of the analysis.
          type: number
        threatLevelText:
          $ref: "#/components/schemas/ThreatLevelTextDto"
      required:
        - score
        - threatLevel
        - threatLevelText
    ReportSpecsDto:
      type: object
      additionalProperties: false
      properties:
        autoStart:
          description: Indicates if threat uses autostart feature.
          type: boolean
        cpuOverrun:
          description: Indicates if overly high CPU usage was detected.
          type: boolean
        crashedApps:
          description: Indicates if any application crash was detected.
          type: boolean
        crashedTask:
          description: Indicates if analysis task crash was detected.
          type: boolean
        debugOutput:
          description: Indicates if any debug data was extracted.
          type: boolean
        executableDropped:
          description: Indicates if threat uses dropped executables.
          type: boolean
        exploitable:
          description: Indicates if any known exploit was detected.
          type: boolean
        injects:
          description: Indicates if threat uses injections.
          type: boolean
        knownThreat:
          description: Indicates if known malware was detected.
          type: boolean
        lowAccess:
          description: Indicates if threat uses low level access.
          type: boolean
        malwareConfig:
          description: Indicates if malware config was extracted from submitted file.
          type: boolean
        memOverrun:
          description: Indicates if overly high RAM usage was detected.
          type: boolean
        multiprocessing:
          description: Indicates if threat uses multiprocessing.
          type: boolean
        networkLoader:
          description: Indicates if network download was detected.
          type: boolean
        networkThreats:
          description: Indicates if any network-related threat was detected by Suricata
            engine.
          type: boolean
        notStarted:
          description: Indicates if submitted file execution failed.
          type: boolean
        privEscalation:
          description: Indicates if any privilege escalation technique was detected.
          type: boolean
        rebooted:
          description: Indicates if system reboot was detected.
          type: boolean
        serviceLauncher:
          description: Indicates if new service registration was detected.
          type: boolean
        spam:
          description: Indicates if spam was detected.
          type: boolean
        staticDetections:
          description: Indicates if any malicious pattern was detected by static analysis
            engine.
          type: boolean
        stealing:
          description: Indicates if malware 'stealer' capability was detected.
          type: boolean
        suspStruct:
          type: boolean
        torUsed:
          description: Indicates if TOR traffic routing was enabled during task creation.
          type: boolean
    TaskTypeDto:
      title: Task type
      description: Type of the main object.
      type: string
      oneOf:
        - description: Indicates that the main object's type is `file`.
          const: file
        - description: Indicates that the main object's type is `url`.
          const: url
        - description: Indicates that the main object's type is `download`.
          const: download
    ObjectTridDto:
      type: object
      additionalProperties: false
      properties:
        procent:
          description: Confidence score (%).
          type: number
          format: float
        extension:
          description: Identified file format.
          type: string
        filetype:
          description: Identified file type.
          type: string
      required:
        - procent
        - extension
        - filetype
    ReportMainObjectDto:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/TaskTypeDto"
        permanentUrl:
          description: URL for downloading the main object from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/files/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]+$
        filename:
          description: Name of the main object file.
          type: string
        basename:
          description: Submitted file name/url.
          type: string
        url:
          description: Full URL.
          type: string
          format: uri-reference
        hashes:
          $ref: "#/components/schemas/HashesApiDto"
        info:
          type: object
          additionalProperties: false
          properties:
            ext:
              description: Detected extension.
              type: string
            file:
              description: Detected file type.
              type: string
            mime:
              description: Detected mime-type.
              type: string
            exif:
              type: object
              maxProperties: 1
              additionalProperties:
                type: object
                additionalProperties:
                  type:
                    - string
                    - integer
                    - number
            trid:
              type: array
              uniqueItems: true
              minItems: 1
              items:
                $ref: "#/components/schemas/ObjectTridDto"
          required:
            - ext
            - file
            - mime
            - exif
            - trid
      required:
        - type
        - hashes
    ScreenshotDto:
      type: object
      additionalProperties: false
      properties:
        uuid:
          $ref: "#/components/schemas/UuidDto"
        time:
          description: Timestamp of the screenshot.
          type: integer
          format: int32
        permanentUrl:
          description: URL for downloading the screenshot from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/screens/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/image\.jpeg$
        thumbnailUrl:
          description: URL for downloading the screenshot thumbnail from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/thumbnails/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/image\.jpeg$
      required:
        - uuid
        - time
        - permanentUrl
        - thumbnailUrl
    ProcessDumpDto:
      type: object
      additionalProperties: false
      properties:
        taskUUID:
          $ref: "#/components/schemas/UuidDto"
        fileNumber:
          type: integer
          format: int32
        permanentUrl:
          description: URL for downloading process dump from the task.
          type: string
          format: uri
          pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/dumps/[0-9a-f]{24}$
        timestamp:
          description: Timestamp of the process dump.
          type: integer
          format: int64
        processName:
          description: Filename of the process.
          type: string
        pid:
          description: Process ID.
          type: integer
          format: int32
          minimum: 0
        address:
          type: string
        size:
          description: Size of the process dump.
          type: integer
          format: int32
          minimum: 0
      required:
        - taskUUID
        - fileNumber
        - permanentUrl
    OsDto:
      title: OS name
      description: Operating system name.
      type: string
      oneOf:
        - description: Indicates that chosen operating system type is `windows`.
          pattern: ^[Ww]indows$
        - description: Indicates that chosen operating system type is `linux`.
          pattern: ^[Ll]inux$
        - description: Indicates that chosen operating system type is `android`.
          pattern: ^[Aa]ndroid$
        - description: Indicates that chosen operating system type is `macos`.
          pattern: ^[Mm]acos$
    OsBitnessDto:
      title: OS bitness
      description: Operating system bitness.
      type: integer
      format: int32
      oneOf:
        - const: 32
        - const: 64
    OsVersionDto:
      title: OS version
      description: Operating system major version.
      type: string
      oneOf:
        - description: Indicates that operating system major version is `7`.
          const: "7"
        - description: Indicates that operating system major version is `10`.
          const: "10"
        - description: Indicates that operating system major version is `11`.
          const: "11"
        - description: Indicates that operating system major version is `12.2`.
          const: "12.2"
        - description: Indicates that operating system major version is `22.04.2`.
          const: 22.04.2
        - description: Indicates that operating system major version is `14`.
          const: "14"
        - description: Indicates that operating system major version is `15`.
          const: "15"
        - description: Indicates that operating system major version is `server 2025`.
          const: server 2025
    EnvTypeDto:
      title: Environment type
      description: Pre-installed soft set.
      type: string
      oneOf:
        - description: (**Deprecated**) Indicates that chosen soft set type is `clean`.
          const: clean
          deprecated: true
        - description: (**Deprecated**) Indicates that chosen soft set type is `office`.
          const: office
          deprecated: true
        - description: Indicates that chosen soft set type is `complete`.
          const: complete
        - description: Indicates that chosen soft set type is `development`.
          const: development
        - description: Indicates that chosen soft set type is `safebrowsing`.
          const: safebrowsing
    ReportSoftwareDto:
      type: object
      additionalProperties: false
      properties:
        title:
          description: Installed software name.
          type: string
        version:
          description: Installed software version.
          type: string
      required:
        - title
    ReportHotfixDto:
      type: object
      additionalProperties: false
      properties:
        title:
          description: Installed operating system hotfixes.
          type: string
      required:
        - title
    ReportEnvironmentDto:
      type: object
      additionalProperties: false
      properties:
        os:
          type: object
          additionalProperties: false
          properties:
            title:
              description: Name of the operating system used.
              type: string
            build:
              description: Operating system build.
              type: integer
              format: int32
            product:
              $ref: "#/components/schemas/OsDto"
            variant:
              description: Operating system edition.
              type: string
            productType:
              description: Client/Server.
              type: string
              oneOf:
                - const: Client
                - const: Server
            bitness:
              $ref: "#/components/schemas/OsBitnessDto"
            major:
              $ref: "#/components/schemas/OsVersionDto"
            servicePack:
              description: Latest service pack installed.
              type: string
            softSet:
              $ref: "#/components/schemas/EnvTypeDto"
          required:
            - product
            - productType
            - major
            - softSet
            - bitness
        internetExplorer:
          type: object
          additionalProperties: false
          properties:
            version:
              description: Latest Internet Explorer version.
              type: string
            kbnum:
              description: Latest Internet Explorer patch.
              type: string
          required:
            - version
            - kbnum
        software:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: "#/components/schemas/ReportSoftwareDto"
        hotfixes:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: "#/components/schemas/ReportHotfixDto"
      required:
        - os
        - software
    ReportCountersDto:
      type: object
      additionalProperties: false
      properties:
        processes:
          type: object
          additionalProperties: false
          properties:
            total:
              description: Total task processes.
              type: integer
              format: int32
