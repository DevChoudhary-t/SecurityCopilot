                dumps:
                  type: array
                  uniqueItems: true
                  minItems: 0
                  items:
                    $ref: "#/components/schemas/ProcessDumpDto"
              required:
                - mainObject
                - video
                - pcap
                - sslkeys
                - screenshots
          required:
            - uuid
            - permanentUrl
            - duration
            - creation
            - creationText
            - reports
            - tags
            - sandbox
            - options
            - scores
            - content
        environments:
