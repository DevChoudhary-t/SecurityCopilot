                      type: string
                      format: uri
                      pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/mp4$
                  required:
                    - present
                pcap:
                  type: object
                  additionalProperties: false
                  properties:
                    present:
                      description: Indicates whether there is a PCAP file in the task.
                      type: boolean
                    permanentUrl:
                      description: URL for downloading PCAP file from the task.
                      type: string
                      format: uri
                      pattern: ^https://([0-9a-z]+\.){2}[0-9a-z]+/tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/download/pcap$
                  required:
                    - present
                sslkeys:
                  type: object
                  additionalProperties: false
                  properties:
                    present:
                      description: Indicates if there are SSL keys in the task.
                      type: boolean
                    permanentUrl:
